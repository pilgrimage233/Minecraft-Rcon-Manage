# ==========================================
# Endless Node 模块配置
# ==========================================

# ------------------------------------------
# SSL 配置
# ------------------------------------------
endless:
  node:
    ssl:
      # 是否信任所有证书（仅用于开发环境）
      trust-all: false
      # 自定义信任库路径
      trust-store-path:
      # 自定义信任库密码
      trust-store-password:
      # 是否启用 SSL
      enabled: true

    # ------------------------------------------
    # 连接池配置
    # ------------------------------------------
    pool:
      # 最大连接数
      max-size: 50

    # ------------------------------------------
    # WebSocket 配置
    # ------------------------------------------
    websocket:
      # 允许的来源（逗号分隔）
      allowed-origins: "*"
      # 最大消息大小（字节）
      max-message-size: 65536
      # 会话空闲超时（毫秒）
      max-session-idle-timeout: 1800000

# ------------------------------------------
# 应用版本
# ------------------------------------------
endless:
  version: 3.9.1

# ------------------------------------------
# 日志配置
# ------------------------------------------
logging:
  level:
    cc.endmc.node: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] [%X{nodeId}] %-5level %logger{36} - %msg%n"
