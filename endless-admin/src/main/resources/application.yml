# 项目相关配置
endless:
  # 名称
  name: EndlessManager
  # 版本
  version: 3.8.5
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /www/minecraft_manager/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 数据库相关配置
  database:
    # 备份配置
    backup:
      enabled: true  # 是否启用自动备份
      path: backup  # 备份文件存储路径
# 接口地址
app-url: http://localhost:5173/

baidu:
  # 百度IP定位API KEY
  # 申请地址：https://lbsyun.baidu.com/index.php?title=webapi/ip-api
  # 默认key极不稳定，申请后请将key替换为你自己的key！
  key: 1ilMd2g27l7TgJwRZubialb5Bb4H6DZT

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 10

# 配置向导
setup:
  # 是否允许远程访问配置向导（默认仅本机访问）
  allow-remote: false

# 日志配置
logging:
  level:
    cc.endmc: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 允许循环依赖（Spring Boot 3临时解决方案）
  main:
    allow-circular-references: true
  # 虚拟线程配置（需要Java 21+）
  threads:
    virtual:
      enabled: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
    include: github
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: 127.0.0.1
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: cc.endmc.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: cc.endmc.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 邮件服务配置
email:
  # 是否启用邮件服务
  enable: false
  # 邮件服务提供商类型：aliyun, qq, 163, gmail, outlook等
  type:
  # 发件人邮箱账号
  account:
  # 发件人邮箱密码或授权码
  password:
  # 发件人显示名称
  senderName: "Minecraft Server"
  # 自定义SMTP服务器配置（可选）
  # smtpHost: smtp.example.com
  # smtpPort: 465
  # ssl: true

whitelist:
  easyauth: true
  # ip限流
  iplimit: 3
  # 管理员通知邮箱
  email:

# 加密配置
encrypt:
  # 加密密钥 使用 openssl rand -base64 16 命令生成
  # 严格保管，不可泄露！
  key: o85Ultxa3spqSVd3RcUP1w==

# RCON配置 如果你不清楚这些是干什么的请勿修改！
rcon:
  # 连接/读写超时时间（毫秒）
  # 建议范围：3000~15000；网络较差可适当调大
  timeout: 5000
  # 单次失败后的重连等待时间（毫秒）
  # 建议范围：500~5000
  reconnect-delay-ms: 1000
  # 单次响应包最大允许大小（字节）
  # 防止异常大包导致内存占用过高，建议按实际命令输出评估
  max-response-size: 4096
  # Socket收发缓冲区大小（字节）
  # 过小会增加分包次数，过大则增加内存占用
  max-buffer-size: 8196
  # RCON 负载字符集
  # 常用：UTF-8；填写非法字符集时程序会自动回退 UTF-8
  payload-charset: UTF-8
  # 发送失败后的最大重试次数
  # 例如 3 表示首次失败后最多再尝试 3 次
  max-reconnect-attempts: 3
  # ByteBuffer对象池容量
  # 值越大并发抖动越小，但会占用更多内存
  buffer-pool-size: 10
  # RCON命令包类型（协议默认值为2）
  # 非特殊协议场景不要修改
  type-command: 2
  # RCON认证包类型（协议默认值为3）
  # 非特殊协议场景不要修改
  type-auth: 3

# QQ机器人配置
qq:
  bot:
    # 重连间隔时间（单位：秒）
    reconnect-interval: 30
    # 重置时间（单位：秒）（超过该时间未重连则重置重连次数）
    reset-time: 600
    # 重连最大次数
    max-reconnect-attempts: 10

app:
  # 鉴权密钥 (请设置为复杂且唯一的密钥)
  secret-key:
  # IP头名称 用于获取真实IP (例如: X-Forwarded-For, X-Real-IP) (多个IP头用逗号分隔，按优先级顺序)
  ip-header-name: X-Real-IP, X-Forwarded-For, X-Client-IP, CF-Connecting-IP
  # 前端配置
  front-end:
    # 前端路径 用于一键升级 (例如: /www/wwwroot/mc.endmc.cc)
    # 如果配置此路径，更新时会自动更新前端文件
    # 系统会自动检测目录结构（dist目录或index.html）
    path:

# 日志清理配置
cleanup:
  # 任务日志清理配置
  job-log:
    # 保留天数，默认30天
    retain-days: 30
  # 操作日志清理配置
  oper-log:
    # 保留天数，默认90天
    retain-days: 90
  # 登录日志清理配置
  login-log:
    # 保留天数，默认30天
    retain-days: 30

# 线程池看门狗配置
watchdog:
  thread-pool:
    # 是否启用线程池看门狗
    enabled: true
    # 监控周期（毫秒）
    interval-ms: 30000
    # 首次延迟（毫秒）
    initial-delay-ms: 30000
    # 单任务超时阈值（毫秒），超过会尝试interrupt
    task-timeout-ms: 120000
    # 队列占用告警阈值（百分比）
    warn-queue-usage-percent: 80
    # 是否自动中断超时任务线程
    auto-interrupt-timeout-task: true
    # 每个周期最多中断线程数，防止抖动
    max-interrupt-per-cycle: 2

# GitHub Actions 配置
github:
  # GitHub Personal Access Token
  # 申请地址：https://github.com/settings/tokens
  # 需要权限：repo (Full control of private repositories), workflow (Update GitHub Action workflows)
  token:
  # GitHub 仓库地址 (格式: owner/repo)
  repository: pilgrimage233/Minecraft-Rcon-Manage
  # 工作流文件名
  workflow-file: release.yml
